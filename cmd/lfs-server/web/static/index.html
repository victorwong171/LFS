<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFS - 高性能大文件存储服务</title>
    <!-- 引入高级现代字体与图标 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=1.0.3">
</head>
<body>
    <div class="app-container">
        <!-- 头部设计 -->
        <header class="app-header">
            <div class="header-logo">
                <div class="logo-icon"><i class="fas fa-cubes"></i></div>
                <div class="logo-text">
                    <h1>LFS</h1>
                    <span class="sub-logo">Local File Storage</span>
                </div>
            </div>
            <div class="header-desc">
                <span class="badge"><i class="fas fa-bolt"></i> HTTP/2 & Gzip</span>
                <span class="badge"><i class="fas fa-shield-alt"></i> MD5 强一致校验</span>
            </div>
        </header>

        <!-- 仪表盘主体 -->
        <main class="dashboard-grid">
            
            <!-- 左侧列：上传与控制 -->
            <div class="left-column-grid">
                <!-- 左侧面板：上传与传输控制 -->
                <section class="panel upload-panel">
                    <div class="panel-header">
                        <h2><i class="fas fa-cloud-upload-alt"></i> 极速文件传输</h2>
                    </div>
                    
                    <div id="drop-area">
                        <div class="upload-glow"></div>
                        <div class="upload-icon-wrapper">
                            <i class="fas fa-arrow-up-from-bracket"></i>
                        </div>
                        <h3>拖拽文件至此区域</h3>
                        <p>支持大文件、多文件并发分片传输</p>
                        <button id="select-files-btn" class="btn btn-primary">
                            <i class="fas fa-file-export"></i> 选择本地文件
                        </button>
                        <input type="file" id="file-input" multiple>
                    </div>
                    
                    <!-- 待上传与传输队列管理 -->
                    <div class="queue-section">
                        <div class="queue-header">
                            <h3>传输任务队列</h3>
                            <button id="upload-button" class="btn btn-success" disabled>
                                <i class="fas fa-play"></i> 开始上传
                            </button>
                        </div>
                        
                        <div id="status">
                            <!-- 状态通知或临时信息 -->
                        </div>
    
                        <!-- 动态上传任务列表 -->
                        <div id="upload-queue-list" class="upload-queue-list">
                            <!-- 动态生成的任务卡片 -->
                            <div class="empty-queue-placeholder">
                                <i class="fas fa-inbox"></i>
                                <p>队列暂空，请先添加文件</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 系统控制面板 -->
                <section class="panel system-panel">
                    <div class="panel-header flex-header">
                        <h2><i class="fas fa-desktop"></i> 宿主机系统控制</h2>
                        <span class="status-indicator-dot" id="system-heartbeat" title="服务心跳"></span>
                    </div>

                    <!-- 状态展示区 -->
                    <div class="system-status-grid">
                        <div class="status-card">
                            <div class="status-card-label"><i class="fas fa-tasks"></i> 活跃传输数</div>
                            <div class="status-card-value" id="sys-active-transfers">0</div>
                        </div>
                        <div class="status-card">
                            <div class="status-card-label"><i class="fas fa-power-off"></i> 关机计划</div>
                            <div class="status-card-value value-small" id="sys-shutdown-mode">无计划</div>
                        </div>
                        <div class="status-card">
                            <div class="status-card-label"><i class="fas fa-tv"></i> 显示器状态</div>
                            <div class="status-card-value value-small" id="sys-display-state">已开启</div>
                        </div>
                    </div>

                    <!-- 定时关机倒计时提示条（仅在有计划时显示） -->
                    <div id="shutdown-countdown-bar" class="countdown-bar" style="display: none;">
                        <span id="countdown-text"><i class="fas fa-hourglass-half"></i> 系统将于 --:-- 关机</span>
                    </div>

                    <!-- 控制操作区 -->
                    <div class="system-controls-section">
                        <!-- 关机模式控制器 -->
                        <div class="control-group">
                            <label class="control-label">关机计划配置</label>
                            <div class="shutdown-config-row">
                                <select id="shutdown-mode-select" class="system-select">
                                    <option value="on_complete">传输完成后关机</option>
                                    <option value="scheduled">定时倒计时关机</option>
                                    <option value="immediate">立即强制关机</option>
                                </select>
                                <div id="shutdown-delay-container" class="delay-input-wrapper" style="display: none;">
                                    <input type="number" id="shutdown-delay-input" class="system-input" min="1" value="10" placeholder="时间">
                                    <select id="shutdown-delay-unit" class="system-select select-unit">
                                        <option value="60">分钟</option>
                                        <option value="1">秒</option>
                                    </select>
                                </div>
                            </div>
                            <div class="shutdown-buttons-row">
                                <button id="btn-trigger-shutdown" class="btn btn-danger btn-full">
                                    <i class="fas fa-power-off"></i> 执行计划
                                </button>
                                <button id="btn-cancel-shutdown" class="btn btn-secondary btn-full" style="display: none;">
                                    <i class="fas fa-ban"></i> 取消计划
                                </button>
                            </div>
                        </div>

                        <!-- 屏幕显示控制器 -->
                        <div class="control-group">
                            <label class="control-label">显示器电源控制</label>
                            <div class="display-buttons-row">
                                <button id="btn-display-off" class="btn btn-action btn-full">
                                    <i class="fas fa-moon"></i> 关闭屏幕
                                </button>
                                <button id="btn-display-on" class="btn btn-success btn-full">
                                    <i class="fas fa-sun"></i> 唤醒屏幕
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 右侧面板：文件浏览器与聊天室 -->
            <div class="right-column-grid">
                
                <!-- 文件浏览器面板 -->
                <section class="panel files-panel">
                    <div class="panel-header flex-header">
                        <h2><i class="fas fa-folder-open"></i> 文件资源管理器</h2>
                        <div class="header-actions">
                            <button id="batch-download-btn" class="btn btn-action" disabled>
                                <i class="fas fa-download"></i> 批量下载
                            </button>
                            <button id="refresh-list" class="btn btn-secondary">
                                <i class="fas fa-arrows-rotate"></i> 刷新
                            </button>
                        </div>
                    </div>
                    
                    <!-- 搜索与筛选栏 -->
                    <div class="search-bar-container">
                        <i class="fas fa-magnifying-glass search-icon"></i>
                        <input type="text" id="search-input" class="search-input" placeholder="输入文件名实时检索...">
                    </div>

                    <!-- 文件列表树 -->
                    <div class="table-container">
                        <div id="file-tree-container">
                            <div class="loading-placeholder">
                                <i class="fas fa-spinner fa-spin"></i> 正在读取文件树...
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 聊天室面板 -->
                <section class="panel chat-panel">
                    <div class="panel-header flex-header">
                        <h2><i class="fas fa-comments"></i> 私域多端聊天室</h2>
                        <div class="chat-meta">
                            <div class="nickname-badge" id="change-nickname-btn" title="点击修改昵称">
                                <i class="fas fa-user-tag"></i> <span id="nickname-display">生成中...</span>
                            </div>
                            <span id="chat-status" class="chat-status disconnected">未连接</span>
                        </div>
                    </div>
                    
                    <div class="chat-container">
                        <!-- 消息渲染区域 -->
                        <div id="chat-messages" class="chat-messages">
                            <!-- 聊天气泡 -->
                        </div>
                        
                        <!-- 发送输入栏 -->
                        <div class="chat-input-container">
                            <input type="text" id="chat-input" class="chat-input" placeholder="输入消息..." disabled>
                            <button id="chat-send-btn" class="btn btn-send" disabled>
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
            
        </main>

        <!-- 极简页脚 -->
        <footer class="app-footer">
            <p>&copy; 2026 LFS Pro. 极致吞吐与性能优化的本地大文件存储系统.</p>
        </footer>
    </div>

    <!-- 模态框：修改昵称 -->
    <div id="nickname-modal" class="modal">
        <div class="modal-content">
            <h3>修改您的昵称</h3>
            <input type="text" id="modal-nickname-input" class="modal-input" maxlength="20" placeholder="请输入新昵称...">
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="btn btn-secondary">取消</button>
                <button id="modal-save-btn" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>
    
    <script src="/static/script.js?v=1.0.3"></script>
</body>
</html>
